<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>ToneScribe</title>
    <meta
      name="description"
      content="Write chords, intervals and scales on the staff — a music-reading companion to ToneSearch."
    />
    <meta name="theme-color" content="#f4f2ec" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ToneScribe" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- ToneScribe's own mark (a clef on paper), generated by
         scripts/gen-app-icons.mjs — deliberately not ToneSearch's diamond, so the
         two are told apart on a home screen. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
  </head>
  <body>
    <div id="app"></div>
    <div class="rotate-notice" aria-hidden="true">
      <div class="rotate-icon">🔄</div>
      <div>Rotate your device to portrait</div>
    </div>
    <script type="module" src="./entry.ts"></script>
  </body>
</html>
